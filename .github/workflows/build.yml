name: Build ClinicFlow

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build
        type: choice
        required: true
        default: android
        options:
          - android
          - ios
          - both

permissions:
  contents: read

concurrency:
  group: clinicflow-release-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  android:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android project files if missing
        run: |
          if [ ! -f android/gradlew ]; then flutter create . --platforms=android --org com.clinicflow --project-name clinicflow; fi
      - name: Configure Firebase (optional)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            mkdir -p android/app
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          fi
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: clinicflow-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 3

  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS project files if missing
        run: |
          if [ ! -f ios/Runner.xcodeproj/project.pbxproj ]; then flutter create . --platforms=ios --org com.clinicflow --project-name clinicflow; fi
      - name: Configure Firebase (optional)
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -n "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          fi
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA for testing
        run: |
          rm -rf Payload clinicflow-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          /usr/bin/zip -qr clinicflow-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: clinicflow-ios-unsigned-ipa
          path: clinicflow-unsigned.ipa
          if-no-files-found: error
          retention-days: 3
