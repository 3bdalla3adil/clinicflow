name: ClinicFlow CI

on:
  push:
    branches: [main, feature/clinic-management-core]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.svg"
  pull_request:
    branches: [main, feature/clinic-management-core]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.svg"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clinicflow-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test --reporter expanded
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('functions/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Build Cloud Functions
        working-directory: functions
        run: npm run build
      - name: Test Firestore security rules in Emulator
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-clinicflow "npm --prefix functions run test:rules"
  # ---------- Android APK ----------
  build-apk:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create . --platforms=android --org ${{ env.ORG }} --project-name ${{ env.APP }}

      - name: Add Firebase config (Android)
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > android/app/google-services.json
          ls -la android/app/google-services.json

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Verify APK exists
        run: |
          ls -la build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 1

  # ---------- iOS IPA (unsigned, for Sideloadly) ----------
  build-ipa:
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform
        run: flutter create . --platforms=ios --org ${{ env.ORG }} --project-name ${{ env.APP }}

      - name: Add Firebase config
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 -d > ios/Runner/GoogleService-Info.plist

      - run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          rm -rf Payload app-release-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r app-release-unsigned.ipa Payload
          ls -la app-release-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa-unsigned
          path: app-release-unsigned.ipa
          if-no-files-found: error
        
