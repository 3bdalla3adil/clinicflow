name: ClinicFlow CI

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clinicflow-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Build Cloud Functions
        working-directory: functions
        run: npm run build
      - name: Test Firestore security rules in Emulator
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-clinicflow "npm --prefix functions run test:rules"
