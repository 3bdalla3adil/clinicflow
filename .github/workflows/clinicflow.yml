name: ClinicFlow CI

on:
  # Feature branches are validated by their PR, avoiding duplicate push + PR runs.
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.svg"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - "**/*.png"
      - "**/*.jpg"
      - "**/*.jpeg"
      - "**/*.svg"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: clinicflow-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Generate localizations
        run: flutter gen-l10n
      - name: Analyze
        run: flutter analyze --fatal-infos
      - run: flutter test --reporter expanded
      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('functions/package.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm install --no-audit --no-fund
      - name: Build Cloud Functions
        working-directory: functions
        run: npm run build
      - name: Test Firestore security rules in Emulator
        run: npx --yes firebase-tools emulators:exec --only firestore --project demo-clinicflow "npm --prefix functions run test:rules"
