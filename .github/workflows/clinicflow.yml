name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ORG: com.example
  APP: clinicflow

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-ipa:
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate iOS platform
        run: flutter create . --platforms=ios --org ${{ env.ORG }} --project-name ${{ env.APP }}

      - name: Add Firebase config
        run: echo "${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}" | base64 -d > ios/Runner/GoogleService-Info.plist

      - run: flutter pub get

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          rm -rf Payload app-release-unsigned.ipa
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -r app-release-unsigned.ipa Payload
          ls -la app-release-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa-unsigned
          path: app-release-unsigned.ipa
          if-no-files-found: error
