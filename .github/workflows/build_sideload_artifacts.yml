name: ClinicFlow Build Pipeline

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  assemble-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Fix and Upgrade Dependencies
        run: |
          flutter pub get
          flutter pub upgrade --major-versions

      - name: Rebuild Android Config
        run: flutter create --platforms=android .

      - name: Build APK
        run: flutter build apk --debug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: ClinicFlow-Android
          path: build/app/outputs/flutter-apk/app-debug.apk

  assemble-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Set Xcode Version
        run: sudo xcode-select --switch /Applications/Xcode.app

      - name: Fix and Upgrade Dependencies
        run: |
          flutter pub get
          flutter pub upgrade --major-versions

      - name: Rebuild iOS Config
        run: flutter create --platforms=ios .

      - name: Install Pods
        run: |
          cd ios
          pod repo update
          pod install --repo-update

      - name: Build Unsigned App
        run: flutter build ios --release --no-codesign

      - name: Create Sideload Payload
        run: |
          cd build/ios/iphoneos
          mkdir Payload
          cp -r Runner.app Payload/
          zip -r ClinicFlow_Sideload.ipa Payload

      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: ClinicFlow-iOS
          path: build/ios/iphoneos/ClinicFlow_Sideload.ipa
